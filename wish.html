<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Jelitakuu 🤍</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Caveat:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF7EF;
    --pink:#FFD6E8;
    --hotpink:#FF6FA0;
    --lavender:#E9D8FF;
    --mint:#CFF6E4;
    --plum:#5B3A56;
    --gold:#FFC857;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Quicksand', sans-serif;
    background:linear-gradient(180deg, var(--lavender) 0%, var(--pink) 50%, var(--cream) 100%);
    color:var(--plum);
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:2rem;
    overflow:hidden;
    position:relative;
  }

  .float-layer{
    position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden;
  }
  .heart{
    position:absolute; bottom:-100px; font-size:1.8rem;
    animation:rise linear infinite; opacity:0.85;
  }
  @keyframes rise{
    0%{ transform:translateY(0) rotate(-5deg) scale(.9); }
    50%{ transform:translateY(-55vh) rotate(6deg) scale(1.05); }
    100%{ transform:translateY(-115vh) rotate(-5deg) scale(.9); }
  }
  .sparkle{
    position:absolute; font-size:1.1rem;
    animation:twinkle 2.4s ease-in-out infinite;
    opacity:0;
  }
  @keyframes twinkle{
    0%,100%{ opacity:0; transform:scale(.6) rotate(0deg); }
    50%{ opacity:1; transform:scale(1.15) rotate(20deg); }
  }
  @media (prefers-reduced-motion: reduce){
    .heart, .sparkle{ animation:none; display:none; }
  }

  .wrap{
    position:relative; z-index:1;
    text-align:center;
    background:white;
    border-radius:32px;
    padding:3rem 2.2rem 2.6rem;
    max-width:520px;
    box-shadow:0 20px 55px rgba(91,58,86,0.2);
    animation:pop-in .8s cubic-bezier(.34,1.56,.64,1) both;
    border:3px solid var(--pink);
  }
  @keyframes pop-in{
    0%{ opacity:0; transform:translateY(28px) scale(.88); }
    100%{ opacity:1; transform:translateY(0) scale(1); }
  }

  .ribbon{
    font-family:'Baloo 2';
    display:inline-block;
    background:var(--gold); color:white;
    padding:.35rem 1.1rem; border-radius:999px;
    font-size:.85rem; font-weight:700; letter-spacing:.03em;
    margin-bottom:1.3rem;
    box-shadow:0 4px 10px rgba(255,200,87,0.5);
  }

  .big-heart{
    font-size:3.6rem; margin-bottom:.8rem;
    display:inline-block;
    animation:beat 1.3s ease-in-out infinite;
  }
  @keyframes beat{
    0%,100%{ transform:scale(1); }
    25%{ transform:scale(1.15); }
    40%{ transform:scale(0.95); }
    60%{ transform:scale(1.1); }
  }

  h1{
    font-family:'Caveat', cursive;
    font-size:clamp(2.4rem, 9vw, 3.6rem);
    font-weight:700;
    line-height:1.2;
    margin-bottom:.6rem;
    background:linear-gradient(90deg, var(--hotpink), #ff9ec7, var(--hotpink));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  p.sub{
    font-size:1.2rem;
    line-height:1.8;
    color:var(--plum);
  }
  p.sub .heartemoji{ display:inline-block; animation:beat 1.3s ease-in-out infinite; animation-delay:.2s; }

  .dots{
    display:flex; justify-content:center; gap:.5rem;
    margin:1.6rem 0;
  }
  .dots span{
    width:8px; height:8px; border-radius:50%;
    background:var(--pink);
    animation:bounce 1.2s ease-in-out infinite;
  }
  .dots span:nth-child(2){ animation-delay:.15s; background:var(--lavender); }
  .dots span:nth-child(3){ animation-delay:.3s; background:var(--mint); }
  @keyframes bounce{
    0%,80%,100%{ transform:translateY(0); opacity:.6; }
    40%{ transform:translateY(-8px); opacity:1; }
  }

  a.back{
    display:inline-block; margin-top:.6rem;
    font-family:'Baloo 2'; font-weight:700;
    color:white; background:var(--hotpink);
    padding:.85rem 1.9rem; border-radius:999px;
    text-decoration:none; font-size:1rem;
    box-shadow:0 8px 20px rgba(255,111,160,0.45);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  a.back:hover{ transform:scale(1.06) rotate(-1deg); box-shadow:0 10px 26px rgba(255,111,160,0.55); }
  a.back:focus-visible{ outline:3px solid var(--plum); outline-offset:3px; }

  .timer-note{
    margin-top:1.2rem; font-size:.8rem; color:var(--plum); opacity:.55;
  }
</style>
</head>
<body>

<div class="float-layer" aria-hidden="true">
  <span class="heart" style="left:5%; animation-duration:12s; animation-delay:0s;">🤍</span>
  <span class="heart" style="left:18%; animation-duration:15s; animation-delay:2s;">🩷</span>
  <span class="heart" style="left:34%; animation-duration:11s; animation-delay:1s;">🤍</span>
  <span class="heart" style="left:50%; animation-duration:14s; animation-delay:3s;">💫</span>
  <span class="heart" style="left:66%; animation-duration:13s; animation-delay:0.5s;">🩷</span>
  <span class="heart" style="left:82%; animation-duration:16s; animation-delay:2.5s;">🤍</span>
  <span class="heart" style="left:92%; animation-duration:12.5s; animation-delay:1.5s;">💫</span>

  <span class="sparkle" style="top:12%; left:15%; animation-delay:0s;">✨</span>
  <span class="sparkle" style="top:22%; left:80%; animation-delay:.6s;">✨</span>
  <span class="sparkle" style="top:68%; left:8%; animation-delay:1.2s;">✨</span>
  <span class="sparkle" style="top:75%; left:88%; animation-delay:.3s;">✨</span>
  <span class="sparkle" style="top:40%; left:92%; animation-delay:1.8s;">⭐</span>
  <span class="sparkle" style="top:85%; left:45%; animation-delay:.9s;">⭐</span>
</div>

<div class="wrap">
  <div class="ribbon">for my favorite person 🎀</div>
  <div class="big-heart">🤍</div>
  <h1>iloveyouusayangggg</h1>
  <p class="sub">i hope you always happy with me <span class="heartemoji">🤍</span></p>
  <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
  <a class="back" href="jelitakuu-birthday.html">back to the surprise 🎀</a>
  <div class="timer-note">taking you back in a few seconds…</div>
</div>

<script>
  setTimeout(()=>{ window.location.href = 'jelitakuu-birthday.html'; }, 6000);
</script>

</body>
</html>
